[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frecon"
version = "0.1.0"
description = "A bounded, authorization-gated reconnaissance CLI for hosts and websites"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
frecon = "frecon.cli:main"

[tool.setuptools.packages.find]
include = ["frecon*"]

[tool.unittest]
start-directory = "tests"